name: Release binaries

# Builds ready-to-run `silver` (client) and `silver-relay` binaries for
# Windows, macOS (Apple Silicon and Intel) and Linux (static).
#
#   * Manual run (workflow_dispatch) without a tag: archives are attached to
#     the run as artifacts, downloadable from the Actions page.
#   * Manual run with a tag (e.g. v0.1.0): the tag is created on the selected
#     branch and the archives are published on a GitHub release.
#   * Tag push `v*`: the same archives are published on a GitHub release.
#
# What a release carries, and how to check it (see README, "Verifying a
# release"):
#   * binaries built with `cargo auditable`, so `cargo audit bin <file>`
#     lists the exact dependencies inside them;
#   * a CycloneDX SBOM per binary and target, inside each archive;
#   * SHA256SUMS over every file, and the project's minisign signature over
#     it when MINISIGN_SECRET_KEY is set and minisign.pub is in the
#     repository (packaging/new-signing-key.sh sets both up). The client
#     checks an update against that signature; a person checks a download
#     against it (README, "Signing releases");
#   * one BUILD-INFO.txt naming, for every target, the compiler, the commit
#     and the flags, so a build can be repeated years later;
#   * `silver` and `silver-relay` for each target, one file each: what a
#     release page carries, what `silver update` fetches, and the simplest
#     thing for a person to download;
#   * a SLSA build provenance attestation from GitHub for every file, which
#     `gh attestation verify <file> --owner IAmForeverAloneToo` checks;
#   * builds with locked dependencies, remapped paths and a fixed timestamp,
#     so a rebuild of the same commit gives the same bytes (CI checks this
#     for Linux on every push).
# Every action is pinned to a commit hash; the pins are moved by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Publish a release with this tag (e.g. v0.1.0); empty builds artifacts only
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-auditable and cargo-cyclonedx
        shell: bash
        run: cargo install --locked cargo-auditable@0.7.5 cargo-cyclonedx@0.5.9

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          # musl-gcc wraps the runner's own compiler, so each Linux target
          # builds on a runner of its architecture.
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          # The same flags as the "reproducible build" job in ci.yml and as
          # the README's rebuild instructions: no build paths or times end
          # up in the binary, so anyone can rebuild the commit and compare.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export RUSTFLAGS="--remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo auditable build --release --locked --workspace --target "${{ matrix.target }}"

      # Signing (docs/design/distribution.md, section 3): with the secrets,
      # both executables are signed (and, on macOS, notarised); with none,
      # a notice says so and the release goes out unsigned; with some, the
      # step fails, since a half-configured secret is a mistake. A signature
      # is the one thing a signed download differs from a rebuild by; the
      # README says how to strip it and compare.
      - name: Sign the Windows executables
        if: contains(matrix.target, 'windows')
        shell: bash
        env:
          AUTHENTICODE_PFX: ${{ secrets.AUTHENTICODE_PFX }}
          AUTHENTICODE_PASSWORD: ${{ secrets.AUTHENTICODE_PASSWORD }}
        run: |
          if [ -z "$AUTHENTICODE_PFX" ] && [ -z "$AUTHENTICODE_PASSWORD" ]; then
            echo "::notice::AUTHENTICODE_PFX and AUTHENTICODE_PASSWORD are not set; the Windows executables are published unsigned (README, \"Signing releases\")"
            exit 0
          fi
          if [ -z "$AUTHENTICODE_PFX" ] || [ -z "$AUTHENTICODE_PASSWORD" ]; then
            echo "::error::AUTHENTICODE_PFX and AUTHENTICODE_PASSWORD must both be set, or neither"
            exit 1
          fi
          pfx="$RUNNER_TEMP/authenticode.pfx"
          printf '%s' "$AUTHENTICODE_PFX" | base64 -d > "$pfx"
          signtool="$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -1)"
          for bin in silver silver-relay; do
            exe="target/${{ matrix.target }}/release/$bin.exe"
            "$signtool" sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$pfx" /p "$AUTHENTICODE_PASSWORD" "$exe"
            "$signtool" verify /pa "$exe"
          done
          rm -f "$pfx"

      - name: Sign and notarise the macOS executables
        if: contains(matrix.target, 'apple')
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          given=0
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -n "${!name}" ]; then given=$((given + 1)); fi
          done
          if [ "$given" -eq 0 ]; then
            echo "::notice::the APPLE_* secrets are not set; the macOS executables are published unsigned and not notarised (README, \"Signing releases\")"
            exit 0
          fi
          if [ "$given" -ne 5 ]; then
            echo "::error::APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD must all be set, or none"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::the certificate holds no Developer ID Application identity"
            exit 1
          fi
          dir="target/${{ matrix.target }}/release"
          for bin in silver silver-relay; do
            codesign --sign "$identity" --options runtime --timestamp --force "$dir/$bin"
            codesign --verify --strict --verbose=2 "$dir/$bin"
          done
          # Notarisation takes an archive; a bare executable gets no stapled
          # ticket, so Gatekeeper asks Apple about it the first time it runs.
          zip -j "$RUNNER_TEMP/notarise.zip" "$dir/silver" "$dir/silver-relay"
          xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          security delete-keychain "$keychain"

      - name: SBOM
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cargo cyclonedx --format json --describe binaries --target "${{ matrix.target }}" --target-in-filename --all
          find crates -name '*.cdx.json' -print

      - name: Package
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            version="$INPUT_TAG"
          else
            case "$GITHUB_REF_NAME" in
              v*) version="$GITHUB_REF_NAME" ;;
              *)  version="dev-${GITHUB_SHA::7}" ;;
            esac
          fi
          name="silver-messenger-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name/sbom"
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          for bin in silver silver-relay; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "dist/$name/"
          done
          cp README.md CHANGELOG.md LICENSE "dist/$name/"
          # What a verifier needs to reproduce these bytes, in the archive
          # and next to it, so the compiler version does not have to be dug
          # out of workflow logs that expire (SM-S-02).
          {
            printf 'target: %s\n' "${{ matrix.target }}"
            printf 'commit: %s\n' "$GITHUB_SHA"
            printf 'toolchain: %s\n' "$(rustc --version)"
            printf 'source-date-epoch: %s\n' "$(git log -1 --format=%ct)"
            printf 'rustflags: --remap-path-prefix=<workspace>=/src --remap-path-prefix=<cargo home>=/cargo\n'
            printf 'command: cargo auditable build --release --locked --workspace --target %s\n' "${{ matrix.target }}"
          } > "dist/$name/BUILD-INFO.txt"
          # Kept aside for the one combined BUILD-INFO.txt the release
          # job writes: five separate ones were five rows of a release
          # page for a file most people never open.
          cp "dist/$name/BUILD-INFO.txt" "dist/build-info-${{ matrix.target }}.part"
          # The SBOMs go inside the archive. They used to be published
          # loose beside it as well, which was ten more rows on every
          # release page for something read by tooling that can unpack a
          # tar; `tar xzf <archive> --wildcards '*/sbom/*'` gets them.
          find crates -name '*.cdx.json' -exec cp {} "dist/$name/sbom/" \;
          if [ -f minisign.pub ]; then cp minisign.pub "dist/$name/"; fi
          # The two programs, one file each: this is what a release page
          # carries and what `silver update` fetches. Named for the
          # version and target so one release's assets never collide, and
          # listed in SHA256SUMS, which is what both the updater and a
          # person check against.
          for bin in silver silver-relay; do
            cp "target/${{ matrix.target }}/release/$bin$ext" \
               "dist/$bin-${version}-${{ matrix.target }}$ext"
          done
          cd dist
          case "${{ matrix.target }}" in
            *windows*) 7z a "$name.zip" "$name" >/dev/null ;;
            *)         tar czf "$name.tar.gz" "$name" ;;
          esac
          rm -r "$name"
          ls -la

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    # `workflow_dispatch` with a tag publishes from whatever branch was
    # selected, so anyone who may run workflows here may publish a release
    # from any commit. Naming an environment is what lets a protection
    # rule — reviewers, or a branch and tag restriction — be attached in
    # the repository's settings (SM-S-09).
    environment: release
    permissions:
      contents: write
      # For the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      # Checkout first: it cleans the workspace, which would remove dist/.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            CHANGELOG.md
            minisign.pub
            packaging
            deploy/install.sh
            deploy/silver-relay.service
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # The Debian packages wrap the Linux archives' binaries, so they
      # carry the same bytes and are listed, signed and attested with the
      # rest (docs/design/distribution.md, section 4).
      - name: Debian packages from the Linux archives
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            name="silver-messenger-${TAG}-${pair##*:}-unknown-linux-musl"
            mkdir -p "unpacked/$arch"
            tar xzf "dist/$name.tar.gz" -C "unpacked/$arch" --strip-components=1
            packaging/deb/build.sh "$TAG" "$arch" "unpacked/$arch" dist
          done
          rm -r unpacked

      # What a release page carries: the program, and what says the
      # program is the program. Nothing else.
      #
      # A page of thirty-odd files is one nobody can read, and the answer
      # to "which do I download" was somewhere among ten SBOMs, five
      # build records, five archives and a packaging tarball. Those are
      # all still built, attested and checked -- they are just not what a
      # release page is for. What is left is the client and the relay for
      # each platform, the Debian packages, and the checksum list with
      # its signature, which `silver update` reads and a person checks by
      # hand (docs/design/distribution.md).
      #
      # This runs before the checksums, so the list names exactly what
      # the page carries and nothing a reader cannot find.
      - name: Only the program
        run: |
          cd dist
          rm -f -- *.cdx.json build-info-*.part BUILD-INFO.txt
          rm -f -- *.tar.gz *.zip
          echo "what the release will carry:"
          ls -la

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The Homebrew formula for this release, from the checksums above.
      # It is what the packaging commit that follows a release copies in,
      # so it is attached to the workflow run rather than to the release:
      # a maintainer's working file is not something a reader of the
      # release page has any use for.
      - name: Packaging files for this release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          packaging/update.sh "$TAG" dist/SHA256SUMS
          mkdir -p packaging-out
          tar czf "packaging-out/silver-messenger-${TAG}-packaging.tar.gz" \
            --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" \
            HomebrewFormula
          sha256sum "packaging-out/silver-messenger-${TAG}-packaging.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaging
          path: packaging-out/*
          if-no-files-found: error

      # The project's own signature over SHA256SUMS, which is what the
      # client checks an update against and what a person checks a download
      # against. Signing here, from a secret, is weaker than signing on a
      # machine the maintainer holds -- whoever holds the repository can
      # reach the secret -- and stronger than not signing at all: it is a
      # separate store from the release assets, so tampering with the
      # published files alone does not survive it. The client verifies
      # against minisign.pub either way, so moving the key offline later
      # changes this step and nothing else (docs/design/updates.md, s.8).
      - name: Sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ -f minisign.pub ]; then
              echo "::warning::the repository publishes minisign.pub but MINISIGN_SECRET_KEY is not set, so this release is unsigned and clients that expect a signature will refuse to update to it (packaging/new-signing-key.sh)"
            else
              echo "::notice::no signing key is configured, so releases carry the build provenance attestation and no maintainer signature (packaging/new-signing-key.sh sets one up)"
            fi
            exit 0
          fi
          if [ ! -f minisign.pub ]; then
            echo "::error::MINISIGN_SECRET_KEY is set but the repository has no minisign.pub to check it against; commit the public half printed by packaging/new-signing-key.sh"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          # -W when there is no password, so an unencrypted key works too.
          if [ -n "${MINISIGN_PASSWORD:-}" ]; then
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS -t "Silver Messenger $TAG"
          else
            minisign -S -W -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS -t "Silver Messenger $TAG"
          fi
          rm -f "$RUNNER_TEMP/minisign.key"
          # The signature must check out against the key the repository
          # publishes, or the secret is not the key people verify with.
          minisign -Vm dist/SHA256SUMS -p minisign.pub
          cat dist/SHA256SUMS.minisig

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # What to download, before what changed: a release page is a
          # list of files sorted by name, and without this the answer to
          # "which one do I want" is somewhere in thirty-odd rows.
          version="${TAG#v}"
          cat > notes.md <<EOF
          ### Which file do I want

          | You are on | Take |
          | --- | --- |
          | **Linux**, x86-64 | \`silver-v${version}-x86_64-unknown-linux-musl\` |
          | **Linux**, ARM64 | \`silver-v${version}-aarch64-unknown-linux-musl\` |
          | **macOS**, Apple silicon | \`silver-v${version}-aarch64-apple-darwin\` |
          | **macOS**, Intel | \`silver-v${version}-x86_64-apple-darwin\` |
          | **Windows** | \`silver-v${version}-x86_64-pc-windows-msvc.exe\` |
          | **Debian or Ubuntu** | \`silver-messenger_${version}_amd64.deb\` (or \`_arm64\`) |
          | **Running a relay** | \`install.sh\`, and the operator's guide |

          That one file is the whole client: make it executable and run it.
          Already on 0.12.0 or later? \`silver update\` does all of this for you.

          The \`silver-messenger-v${version}-*\` archives hold the same client
          with the relay, the SBOMs, the changelog and the licence beside it.

          <details><summary>Checking what you downloaded</summary>

          \`\`\`sh
          minisign -Vm SHA256SUMS -p minisign.pub   # the list is the project's
          sha256sum -c --ignore-missing SHA256SUMS  # your file is on the list
          \`\`\`

          \`minisign.pub\` is at the root of the repository. \`BUILD-INFO.txt\` names
          the compiler, commit and flags each binary was built with, so the build
          can be repeated. Every file also carries a GitHub build provenance
          attestation: \`gh attestation verify <file> --owner IAmForeverAloneToo\`.

          </details>

          ---

          EOF
          # The "## <version> - <date>" section for this tag, without the heading.
          awk -v v="$version" '/^## / { on = ($2 == v); next } on { print }' CHANGELOG.md >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: notes.md
          # The notes are the changelog section for this tag and nothing
          # else. GitHub's generated notes list pull request titles written
          # by whoever opened them, which would reach every reader of the
          # release page unreviewed (SM-S-09).
          generate_release_notes: false

  image:
    # The relay's container image for amd64 and arm64, built from the very
    # binaries the release publishes (deploy/Dockerfile, BINARY_FROM=prebuilt)
    # on an empty base, pushed to GitHub's registry as
    # ghcr.io/<owner>/silver-relay:<version> and :latest, with a build
    # provenance attestation on the image digest. Timestamps are rewritten
    # to the commit's, so a rebuild of the same release gives the same
    # layers.
    name: Container image
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: "*-unknown-linux-musl"
          merge-multiple: true

      - name: Unpack the Linux binaries
        id: prepare
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch="${pair%%:*}"
            name="silver-messenger-${TAG}-${pair##*:}-unknown-linux-musl"
            mkdir -p "prebuilt/linux/$arch"
            tar xzf "dist/$name.tar.gz" -C "prebuilt/linux/$arch" --strip-components=1 "$name/silver-relay"
          done
          find prebuilt -type f -exec sha256sum {} +
          # GitHub's registry wants the owner in lower case.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/silver-relay" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.prepare.outputs.epoch }}
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BINARY_FROM=prebuilt
          tags: |
            ${{ steps.prepare.outputs.image }}:${{ steps.prepare.outputs.version }}
            ${{ steps.prepare.outputs.image }}:latest
          # The attestation below stands in for BuildKit's own, which would
          # add unreproducible manifests to the image.
          provenance: false
          sbom: false
          outputs: type=image,push=true,oci-mediatypes=true,rewrite-timestamp=true

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.prepare.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
