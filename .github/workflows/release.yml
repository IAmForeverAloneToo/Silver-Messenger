name: Release binaries

# Builds ready-to-run `silver` (client) and `silver-relay` binaries for
# Windows, macOS (Apple Silicon and Intel) and Linux (static).
#
#   * Manual run (workflow_dispatch) without a tag: archives are attached to
#     the run as artifacts, downloadable from the Actions page.
#   * Manual run with a tag (e.g. v0.1.0): the tag is created on the selected
#     branch and the archives are published on a GitHub release.
#   * Tag push `v*`: the same archives are published on a GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Publish a release with this tag (e.g. v0.1.0); empty builds artifacts only
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: cargo build --release --workspace --target "${{ matrix.target }}"

      - name: Package
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            version="$INPUT_TAG"
          else
            case "$GITHUB_REF_NAME" in
              v*) version="$GITHUB_REF_NAME" ;;
              *)  version="dev-${GITHUB_SHA::7}" ;;
            esac
          fi
          name="silver-messenger-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          for bin in silver silver-relay; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "dist/$name/"
          done
          cp README.md CHANGELOG.md LICENSE "dist/$name/"
          cd dist
          case "${{ matrix.target }}" in
            *windows*) 7z a "$name.zip" "$name" >/dev/null ;;
            *)         tar czf "$name.tar.gz" "$name" ;;
          esac
          rm -r "$name"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
