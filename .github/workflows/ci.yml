name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: advisories + licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  tui:
    name: terminal tests (${{ matrix.term }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        term: [xterm-256color, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install pyte || pip install --break-system-packages pyte
      - run: TERMS=${{ matrix.term }} tests/tui/run.sh

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The repository pins the stable toolchain in rust-toolchain.toml, which
    # would override the nightly installed below for cargo-fuzz's own build
    # and make its -Z sanitizer flags fail. RUSTUP_TOOLCHAIN wins over the
    # file, so every cargo/rustc call in this job uses nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly
      # The prebuilt cargo-fuzz is a static musl binary and takes its own
      # build triple as the default target; musl has no std installed here
      # and cannot use the address sanitizer, so the target is named.
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    strategy:
      fail-fast: false
      matrix:
        target: [frames, envelope, blob_chunk, session, invite_link, file_name, stored]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo fuzz run --target $FUZZ_TARGET_TRIPLE ${{ matrix.target }} -- -max_total_time=60 -max_len=4096
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: fuzz/artifacts
