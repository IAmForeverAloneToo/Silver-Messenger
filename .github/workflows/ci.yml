name: CI

# Every action is pinned to a commit hash (the version follows in a
# comment); the pins are moved by hand. The workflow token can only read.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: How long the soak runs, in minutes (up to 360)
        required: false
        default: "3"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: advisories + licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
      # cargo audit itself, rather than the action around it: the action
      # posts its findings as a check run, which needs a token that can
      # write checks, and fails the job when it cannot; the command's own
      # exit code says what matters (a vulnerability fails, an unmaintained
      # crate warns), and installing a built binary is faster than
      # compiling one.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file Cargo.lock

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  tui:
    name: terminal tests (${{ matrix.term }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        term: [xterm-256color, linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install pyte==0.8.2 || pip install --break-system-packages pyte==0.8.2
      - run: TERMS=${{ matrix.term }} tests/tui/run.sh

  soak:
    name: soak (${{ inputs.soak_minutes || 3 }} minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pip install pyte==0.8.2 || pip install --break-system-packages pyte==0.8.2
      - run: cargo build --workspace --locked
      - run: TERM=xterm-256color python3 tests/tui/soak.py --minutes ${{ inputs.soak_minutes || 3 }}

  packaging:
    # The packages, each checked the way its platform does
    # (docs/design/distribution.md, section 5): the Debian package built
    # from the debug binaries and installed in a container, the PKGBUILD
    # and its .SRCINFO in an Arch container, the winget manifests against
    # their schemas. The formula has its own job on macOS.
    name: packages (Debian, Arch, winget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Static binaries, as the release's are, so lintian sees the same
      # shape of package; a debug build is not stripped, so that is done
      # here (the release profile strips).
      - name: Static binaries for the package
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools lintian
          CC_x86_64_unknown_linux_musl=musl-gcc cargo build --workspace --locked --target x86_64-unknown-linux-musl
          mkdir -p bins
          cp target/x86_64-unknown-linux-musl/debug/silver target/x86_64-unknown-linux-musl/debug/silver-relay bins/
          strip bins/silver bins/silver-relay
      - name: Debian package, linted and installed in a container
        run: |
          packaging/deb/build.sh "0.0.0~dev.${GITHUB_SHA::7}" amd64 bins out
          lintian --fail-on error --tag-display-limit 0 out/*.deb
          docker run --rm -v "$PWD/out:/pkg:ro" debian:stable-slim sh -ec '
            apt-get update -qq >/dev/null
            apt-get install -y -qq /pkg/*.deb >/dev/null
            silver --version
            silver-relay --version
            test -f /lib/systemd/system/silver-relay.service
            getent passwd silver
            apt-get remove -y -qq silver-messenger >/dev/null
            test ! -e /usr/bin/silver'
      - name: Arch package, its .SRCINFO current and namcap clean of errors
        run: |
          docker run --rm -v "$PWD/packaging/aur:/aur:ro" archlinux:base-devel sh -ec '
            pacman -Sy --noconfirm --needed namcap >/dev/null
            useradd -m builder
            cp -r /aur /build && chown -R builder /build && cd /build
            su builder -s /bin/sh -c "makepkg --printsrcinfo" | diff -u .SRCINFO -
            namcap PKGBUILD | tee namcap.txt
            ! grep -q " E: " namcap.txt'
      - name: winget manifests against their schemas
        run: |
          pip install pyyaml jsonschema || pip install --break-system-packages pyyaml jsonschema
          python3 packaging/winget/validate.py

  homebrew:
    # This checkout tapped as it would be by a person, then the formula
    # audited, styled, installed from the release it names, and tested.
    name: Homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tap, audit, install and test
        run: |
          brew tap iamforeveralonetoo/silver "$PWD"
          brew audit --strict iamforeveralonetoo/silver/silver-messenger
          brew style iamforeveralonetoo/silver/silver-messenger
          brew install --formula iamforeveralonetoo/silver/silver-messenger
          brew test iamforeveralonetoo/silver/silver-messenger
          silver --version

  reproducible:
    # The release binaries are built with these exact flags; two clean
    # builds of the same commit must be byte for byte the same, or a
    # published binary could not be checked against the source.
    name: reproducible build
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Build twice from scratch and compare
        run: |
          # Same flags as the release workflow and the README's rebuild
          # instructions. Both builds use target/ (cleaned in between), the
          # directory a release and a verifier build in too: under the
          # remap it is /src/target for everyone, so nothing about where
          # the build ran can tell the two apart.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export RUSTFLAGS="--remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          mkdir -p first
          for n in 1 2; do
            cargo clean --release
            cargo build --release --locked --workspace --target "$TARGET"
            if [ "$n" = 1 ]; then
              cp "target/$TARGET/release/silver" "target/$TARGET/release/silver-relay" first/
            fi
          done
          for bin in silver silver-relay; do
            cmp "first/$bin" "target/$TARGET/release/$bin"
            sha256sum "target/$TARGET/release/$bin"
          done
          echo "both builds are identical"

  acme:
    # The relay's own ACME client against Pebble, Let's Encrypt's test
    # server: account, TLS-ALPN-01 on the relay's listener, a chain that
    # verifies, the cache a restart needs. Pebble is built from its pinned
    # module version; the Go checksum database vouches for the source.
    name: ACME against Pebble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
      - run: SILVER_PEBBLE="$HOME/go/bin/pebble" cargo test -p silver-relay --test acme -- --nocapture

  image:
    # The container image, built from source as a self-builder would, then
    # run the way the Compose recipe runs it: read-only filesystem, an
    # unprivileged user, an empty base. It must come up, answer /healthz and
    # take administration through its socket.
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.epoch }}
          load: true
          tags: silver-relay:ci
          provenance: false
      - name: Run it
        run: |
          docker run -d --name relay --read-only \
            --tmpfs /run/silver-relay:uid=1000,gid=1000,mode=0700 \
            -p 127.0.0.1:7777:7777 silver-relay:ci --ephemeral
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7777/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:7777/healthz
          docker exec relay silver-relay admin status
          docker exec relay silver-relay admin ban 203.0.113.1 --note ci
          docker exec relay silver-relay admin bans | grep -q 203.0.113.1
          docker exec relay silver-relay admin identities
          docker logs relay
          docker rm -f relay

  formal:
    # The Verifpal models of the handshake and the ratchet (formal/), each
    # query checked against the outcome expected.txt records, including
    # the ones a model is meant to break. Verifpal is built from its pinned
    # crates.io release with its own lockfile.
    name: formal models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: true
      - run: cargo install --locked verifpal --version 1.4.2
      - run: formal/check.sh

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The repository pins the stable toolchain in rust-toolchain.toml, which
    # would override the nightly installed below for cargo-fuzz's own build
    # and make its -Z sanitizer flags fail. RUSTUP_TOOLCHAIN wins over the
    # file, so every cargo/rustc call in this job uses nightly.
    env:
      RUSTUP_TOOLCHAIN: nightly
      # The prebuilt cargo-fuzz is a static musl binary and takes its own
      # build triple as the default target; musl has no std installed here
      # and cannot use the address sanitizer, so the target is named.
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
    strategy:
      fail-fast: false
      matrix:
        target: [frames, envelope, blob_chunk, session, invite_link, file_name, stored, group_body, device]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - run: cargo fuzz run --target $FUZZ_TARGET_TRIPLE ${{ matrix.target }} -- -max_total_time=60 -max_len=4096
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: fuzz/artifacts
