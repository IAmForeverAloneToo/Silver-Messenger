name: Deploy relay

# Builds a static relay binary on the runner and installs it on the server
# over SSH, so the server needs neither Rust nor access to this repository.
# Also offers status / logs / restart. Needs repository secrets:
#   VPS_HOST     server IP or hostname
#   VPS_SSH_KEY  private key whose public half is in the server's authorized_keys
#   VPS_USER     optional, defaults to root
# and optionally the repository variable VPS_DOMAIN (a hostname pointing at
# the server) to serve the relay over HTTPS/wss on port 443.
#
# The binary is built the same way as a release (cargo auditable, locked
# dependencies, remapped paths), so it carries its dependency list and
# matches what the release workflow would produce for the same commit.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do on the server
        type: choice
        default: deploy
        options: [deploy, status, logs, restart]

permissions:
  contents: read

concurrency: deploy-relay

env:
  TARGET: x86_64-unknown-linux-musl
  CARGO_INCREMENTAL: 0

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          test -n "$VPS_SSH_KEY" || { echo "::error::repository secret VPS_SSH_KEY is not set"; exit 1; }
          test -n "$VPS_HOST" || { echo "::error::repository secret VPS_HOST is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install Rust
        if: inputs.action == 'deploy'
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        if: inputs.action == 'deploy'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-auditable
        if: inputs.action == 'deploy'
        run: cargo install --locked cargo-auditable@0.7.5

      - name: Build static relay binary
        if: inputs.action == 'deploy'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          export CC_x86_64_unknown_linux_musl=musl-gcc
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export RUSTFLAGS="--remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo auditable build --release --locked -p silver-relay --target "$TARGET"
          file "target/$TARGET/release/silver-relay"
          sha256sum "target/$TARGET/release/silver-relay"

      - name: Install on the server
        if: inputs.action == 'deploy'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          DOMAIN: ${{ vars.VPS_DOMAIN }}
        run: |
          target="$VPS_USER@$VPS_HOST"
          ssh "$target" 'rm -rf /tmp/silver-deploy && mkdir -p /tmp/silver-deploy'
          scp "target/$TARGET/release/silver-relay" deploy/silver-relay.service deploy/install.sh "$target:/tmp/silver-deploy/"
          ssh "$target" "SILVER_DOMAIN='$DOMAIN' bash /tmp/silver-deploy/install.sh; rc=\$?; rm -rf /tmp/silver-deploy; exit \$rc"

      - name: Run "${{ inputs.action }}" on the server
        if: inputs.action != 'deploy'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          ACTION: ${{ inputs.action }}
        run: |
          target="$VPS_USER@$VPS_HOST"
          case "$ACTION" in
            status)  ssh "$target" "systemctl status silver-relay --no-pager; ss -ltnp | grep silver-relay || true" ;;
            logs)    ssh "$target" "journalctl -u silver-relay -n 200 --no-pager" ;;
            restart) ssh "$target" "systemctl restart silver-relay && sleep 1 && systemctl is-active silver-relay" ;;
          esac
