[workspace]
resolver = "2"
members = [
    "crates/silver-protocol",
    "crates/silver-relay",
    "crates/silver-client",
    "crates/silver-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/IAmForeverAloneToo/Silver-Messanger"
rust-version = "1.85"

[workspace.dependencies]
# internal
silver-protocol = { path = "crates/silver-protocol" }
silver-relay = { path = "crates/silver-relay" }
silver-client = { path = "crates/silver-client" }

# async runtime & networking
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util", "signal"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
rcgen = "0.14"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"

# crypto (pinned to the mutually compatible rand_core 0.6 generation)
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# errors, logging, cli
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
uuid = { version = "1", features = ["v4"] }

# tui
ratatui = "0.30"
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
