[package]
name = "silver-key"
description = "Talking to a FIDO2 security key for Silver Messenger: CTAP2 with hmac-secret, credProtect and the PIN"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Let chains, as the client it is built into.
rust-version = "1.89"

[features]
# The software authenticator (src/soft.rs), for the tests of the crates that
# build on this one; never in a release build.
soft = []

[dependencies]
# p256 is a newer generation than the one OpenMLS's P-256 ciphersuites
# hold (see the workspace Cargo.toml); the rest were in the tree already,
# through the client.
p256 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }

# For one constant, O_NONBLOCK, when opening /dev/hidraw.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

# Windows' own WebAuthn API, HID, the pipe and the elevated start; the
# generation of windows-sys already in the tree, with more of its modules.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
