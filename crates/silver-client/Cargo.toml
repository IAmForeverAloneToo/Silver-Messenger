[package]
name = "silver-client"
description = "Client core for Silver Messenger: relay connection, local store, encrypt/decrypt (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
silver-protocol = { workspace = true }
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
openmls_memory_storage = { workspace = true }
tls_codec = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-webpki = { workspace = true }
tokio-rustls = { workspace = true }
rustls-native-certs = { workspace = true }
webpki-roots = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
# For the name a history file is filed under, which is a MAC of the
# conversation's id so that a directory listing is not the contact list.
hmac = { workspace = true }
uuid = { workspace = true }
bs58 = { workspace = true }
argon2 = { workspace = true }
minisign-verify = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
unicode-normalization = { workspace = true }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
# Both already build as part of this crate's tree (argon2 pulls blake2,
# openmls pulls ed25519-dalek); the update tests use them to mint a
# minisign signature, which is Ed25519 over BLAKE2b-512, so that the
# accepting half of the check is tested and not only the refusals.
blake2 = "0.11"
ed25519-dalek = { workspace = true }
rcgen = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
tempfile = "3"
silver-relay = { workspace = true }
