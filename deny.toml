# cargo-deny configuration: security advisories, licenses, duplicate crates
# and dependency sources. Run locally with `cargo deny check`.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
]

[bans]
# A crate in the tree twice is more code in the binary and one more thing
# to track advisories for. Every duplicate below is upstream's to
# converge — a dependency of OpenMLS, axum or rcgen pinning an older
# generation of the same crate — so each is skipped by name rather than
# by version, and the versions move without touching this file. What the
# deny catches is a *new* name joining the list: that is a duplicate this
# repository introduced, and it wants a look before it is accepted
# (SM-S-07). `cargo deny check bans` lists what each entry stands for.
multiple-versions = "deny"
wildcards = "allow"
skip = [
{ name = "base64" },
{ name = "block-buffer" },
{ name = "chacha20" },
{ name = "const-oid" },
{ name = "cpufeatures" },
{ name = "crypto-common" },
{ name = "curve25519-dalek" },
{ name = "der" },
{ name = "digest" },
{ name = "foldhash" },
{ name = "getrandom" },
{ name = "hashbrown" },
{ name = "hkdf" },
{ name = "hmac" },
{ name = "nom" },
{ name = "pkcs8" },
{ name = "rand" },
{ name = "rand_chacha" },
{ name = "rand_core" },
{ name = "sha1" },
{ name = "sha2" },
{ name = "sha3" },
{ name = "signature" },
{ name = "spki" },
{ name = "syn" },
{ name = "tokio-tungstenite" },
{ name = "tungstenite" },
{ name = "webpki-roots" },
{ name = "windows-sys" },
{ name = "windows-targets" },
{ name = "windows_x86_64_gnu" },
{ name = "windows_x86_64_msvc" },
{ name = "x25519-dalek" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
