# cargo-deny configuration: security advisories, licenses, duplicate crates
# and dependency sources. Run locally with `cargo deny check`.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Each entry is a crate in the built graph whose advisory has no fix this
# tree can take yet, with why it does not reach this project's secrets and
# what removes it. Every other advisory still fails the check; ci.yml
# passes over the same vulnerability for `cargo audit`, and
# docs/THREAT_MODEL.md ("Supply chain") says the same.
ignore = [
    # crypto-bigint 0.5.5, timing in arithmetic meant to be constant-time.
    # Fixed in 0.7.6, which elliptic-curve 0.13 cannot take; it comes in
    # only with the P-256, P-384 and K-256 code of openmls_rust_crypto and
    # hpke-rs-rust-crypto. Groups run on one ciphersuite, X-Wing with
    # Ed25519, and a key package or group of any other is refused before
    # use (silver-client groups/mod.rs), so no secret of ours goes through
    # it. silver-key's own P-256 (the security key's PIN protocol, which
    # does run) is on p256 0.14 and crypto-bigint 0.7, out of its reach.
    # Drop once both move to an elliptic-curve on crypto-bigint 0.7.
    { id = "RUSTSEC-2026-0387", reason = "P-curve code linked through OpenMLS, never run: one X25519/ML-KEM/Ed25519 ciphersuite" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
]

[bans]
# A crate in the tree twice is more code in the binary and one more thing
# to track advisories for. Every duplicate below is upstream's to
# converge — a dependency of OpenMLS, axum or rcgen pinning an older
# generation of the same crate — so each is skipped by name rather than
# by version, and the versions move without touching this file. What the
# deny catches is a *new* name joining the list: that is a duplicate this
# repository introduced, and it wants a look before it is accepted
# (SM-S-07). `cargo deny check bans` lists what each entry stands for.
# The AEAD, AES and Ed25519 names (aead, aes, chacha20poly1305, cipher,
# ed25519, ed25519-dalek, inout, poly1305, universal-hash) are the older
# generation openmls_rust_crypto 0.6 and hpke-rs 0.7 still build on, the
# newest there is; this repository's own code moved to the next one.
# The P-256 names (base16ct, crypto-bigint, elliptic-curve, ff, group,
# p256, primeorder, sec1) likewise: OpenMLS's P-curve ciphersuites hold
# the 0.13 generation, and silver-key's PIN protocol, which runs at every
# security-key unlock, is on 0.14, whose crypto-bigint 0.7 is the one
# RUSTSEC-2026-0387 is fixed in.
multiple-versions = "deny"
wildcards = "allow"
skip = [
{ name = "aead" },
{ name = "aes" },
{ name = "base16ct" },
{ name = "base64" },
{ name = "block-buffer" },
{ name = "chacha20" },
{ name = "chacha20poly1305" },
{ name = "cipher" },
{ name = "const-oid" },
{ name = "cpufeatures" },
{ name = "crypto-bigint" },
{ name = "crypto-common" },
{ name = "curve25519-dalek" },
{ name = "der" },
{ name = "digest" },
{ name = "ed25519" },
{ name = "ed25519-dalek" },
{ name = "elliptic-curve" },
{ name = "ff" },
{ name = "foldhash" },
{ name = "getrandom" },
{ name = "group" },
{ name = "hashbrown" },
{ name = "hkdf" },
{ name = "hmac" },
{ name = "inout" },
{ name = "nom" },
{ name = "p256" },
{ name = "pkcs8" },
{ name = "poly1305" },
{ name = "primeorder" },
{ name = "rand" },
{ name = "rand_chacha" },
{ name = "rand_core" },
{ name = "sec1" },
{ name = "sha1" },
{ name = "sha2" },
{ name = "signature" },
{ name = "spki" },
{ name = "syn" },
{ name = "tokio-tungstenite" },
{ name = "tungstenite" },
{ name = "universal-hash" },
{ name = "webpki-roots" },
{ name = "x25519-dalek" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
